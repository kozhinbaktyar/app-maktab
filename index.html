<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئامادەبوون بە کارت و دەموچاو</title>
    <style>
        body { font-family: sans-serif; background-color: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .scanner-container { background: #34495e; padding: 30px; border-radius: 15px; text-align: center; width: 650px; max-width: 95vw; }
        .video-box { position: relative; width: 320px; height: 240px; margin: 15px auto; background: #000; border-radius: 10px; overflow: hidden; border: 3px solid #1abc9c; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-end { background-color: #95a5a6; color: white; }
        .student-card-display { background: white; color: #333; padding: 20px; border-radius: 10px; margin-top: 15px; }
        .student-card-display img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
        .blue-active { background-color: #3498db !important; color: white !important; }
        .red-active { background-color: #e74c3c !important; color: white !important; }
    </style>
</head>
<body>

    <div class="scanner-container">
        <h2>سیستەمی ئامادەبوون (کارت + دەموچاو)</h2>

        <div>
            <button id="btn-start" class="btn btn-start">دەستپێکردنی دەوام</button>
            <button id="btn-end" class="btn btn-end" disabled>کۆتایی دەوام</button>
        </div>

        <!-- کامێرا بۆ دۆزینەوەی دەموچاو -->
        <div class="video-box">
            <video id="webcam" autoplay muted playsinline></video>
        </div>

        <div id="session-status" style="margin: 10px 0;">دەوام: دەستپێنەکراوە</div>

        <div class="student-card-display" id="student-display">
            <img id="st-image" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' fill='%23ccc'/></svg>">
            <h2 id="st-name">ڕووت بێنە بەرامبەر کامێراکە یان کارت بنێ...</h2>
            <h4 id="st-class">---</h4>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import * as faceapi from 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.esm.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.firebasestorage.app",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let sessionActive = false;
        let currentDateStr = null;
        let studentsCache = {}; 
        let attendanceCache = {}; 
        let faceMatcher = null;
        let isFaceProcessing = false;
        let lastFaceScanTime = 0;

        const video = document.getElementById('webcam');
        const display = document.getElementById('student-display');

        // ۱. بارکردنی مۆدێلەکان و کامێرا
        async function initFaceAPI() {
            document.getElementById('st-name').innerText = "چاوەڕوانبە.. مۆدێلەکان باردەکرێن...";
            await faceapi.nets.tinyFaceDetector.loadFromUri('/models');
            await faceapi.nets.faceLandmark68Net.loadFromUri('/models');
            await faceapi.nets.faceRecognitionNet.loadFromUri('/models');
            
            // بازدانی کامێرا
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
                video.srcObject = stream;
            } catch (err) {
                console.error("کامێرا نەکرایەوە:", err);
            }
            document.getElementById('st-name').innerText = "تکایە کارت بنێ یان سەیری کامێراکە بکە...";
        }
        initFaceAPI();

        // ۲. هێنانی قوتابییان و نوێکردنەوەی FaceMatcher
        onSnapshot(collection(db, "students"), (snap) => {
            studentsCache = {};
            const labeledDescriptors = [];

            snap.forEach(d => {
                const data = d.data();
                studentsCache[d.id] = data;

                // ئەگەر قوتابییەکە faceDescriptorی هەبوو، بۆ بەراوردکاری زیادی دەکەین
                if (data.faceDescriptor && Array.isArray(data.faceDescriptor)) {
                    const float32Array = new Float32Array(data.faceDescriptor);
                    labeledDescriptors.push(
                        new faceapi.LabeledFaceDescriptors(d.id, [float32Array])
                    );
                }
            });

            if (labeledDescriptors.length > 0) {
                // threshold = 0.5 (کەمتر بێت وردتر دەبێت بەڵام قورستر دەیناسێتەوە)
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
            }
        });

        // ۳. دەستپێکردنی دەوام
        document.getElementById('btn-start').addEventListener('click', () => {
            currentDateStr = new Date().toISOString().split('T')[0];
            sessionActive = true;
            document.getElementById('session-status').innerText = `دەوام: چالاکە (${currentDateStr})`;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-end').disabled = false;
            
            // دەستپێکردنی پشکنینی ڕاستەوخۆ بە کامێرا
            startFaceRecognition();
        });

        // ٤. بازنەی پشکنینی دەموچاو (Loop)
        function startFaceRecognition() {
            setInterval(async () => {
                if (!sessionActive || isFaceProcessing || !faceMatcher) return;

                const now = Date.now();
                if (now - lastFaceScanTime < 3000) return; // ٣ چسک مەودا بڕەدە لە نێوان ناسیەنەوەکاندا

                isFaceProcessing = true;

                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                              .withFaceLandmarks()
                                              .withFaceDescriptor();

                if (detection) {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (match.label !== 'unknown') {
                        const studentId = match.label;
                        lastFaceScanTime = now;
                        markAttendance(studentId, 'face');
                    }
                }
                isFaceProcessing = false;
            }, 300); // هەر 300ms جارێک فریمێک پشکنین دەکات
        }

        // ٥. تۆمارکردنی ئامادەبوون (وەک یەک بۆ کارت و بۆ دەموچاو کاردەکات)
        async function markAttendance(studentId, method) {
            const student = studentsCache[studentId];
            if (!student) return;

            document.getElementById('st-name').innerText = student.name + (method === 'face' ? " (بە دەموچاو)" : "");
            document.getElementById('st-class').innerText = student.class || "---";
            if (student.imageUrl) document.getElementById('st-image').src = student.imageUrl;

            display.classList.remove('red-active');
            display.classList.add('blue-active');

            await setDoc(
                doc(collection(doc(db, "attendance", currentDateStr), "records"), studentId),
                { 
                    status: 'present', 
                    name: student.name || null, 
                    class: student.class || null, 
                    method: method, // دیاریکردنی ڕێگاکە: face یان card
                    time: new Date().toISOString() 
                },
                { merge: true }
            );
        }
    </script>
</body>
</html>
