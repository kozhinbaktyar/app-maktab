<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سەرەکی - سیستەمی ئامادەبوون</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f6f9; color: #333; margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .home-box {
        background: white; width: 480px; max-width: 100%; border-radius: 14px;
        padding: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); text-align: center;
    }
    .greet { color: #16324f; margin-bottom: 4px; }
    .role-tag {
        display: inline-block; background: #eef7f0; color: #1f6b3b; font-size: 12px;
        font-weight: bold; padding: 3px 12px; border-radius: 20px; margin-bottom: 22px;
    }
    .role-tag.admin { background: #fdf3e8; color: #96650c; }
    .nav-cards { display: flex; flex-direction: column; gap: 14px; }
    .nav-card {
        display: block; text-decoration: none; background: #16324f; color: white;
        padding: 20px; border-radius: 10px; font-size: 17px; font-weight: bold;
        transition: transform .15s, background .15s;
    }
    .nav-card:hover { background: #0f2740; transform: translateY(-2px); }
    .nav-card .desc { display: block; font-size: 12px; font-weight: normal; color: #cfe4f0; margin-top: 4px; }
    .nav-card.scanner { background: #2c3e50; }
    .nav-card.admin { background: #2980b9; }
    .logout-btn {
        margin-top: 24px; background: none; border: 1px solid #ddd; color: #888;
        padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit;
    }
    .logout-btn:hover { background: #f5f5f5; color: #c0392b; border-color: #c0392b; }
    .loading { color: #888; padding: 40px 0; }
</style>
</head>
<body>

<div class="home-box" id="home-box" style="display:none;">
    <h2 class="greet">بەخێربێیت، <span id="staff-name"></span></h2>
    <span class="role-tag" id="role-tag"></span>

    <div class="nav-cards">
        <a href="scanner.html" class="nav-card scanner">
            📡 شاشەی سکانی کارت
            <span class="desc">تۆمارکردنی ئامادەبوون بە RFID</span>
        </a>
        <a href="admin.html" class="nav-card admin" id="admin-card">
            🗂️ پانێڵی بەڕێوەبردن
            <span class="desc">قوتابیان، ڕاپۆرت، دۆخی ڕۆژانە</span>
        </a>
    </div>

    <button class="logout-btn" id="btn-logout">چوونەدەرەوە</button>
</div>

<div class="loading" id="loading-msg">چاوەڕوانبە...</div>

<script type="module">
    import { requireStaffAuth, logout } from "./auth-guard.js";

    requireStaffAuth().then((staff) => {
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('home-box').style.display = 'block';
        document.getElementById('staff-name').innerText = staff.name;
        const roleTag = document.getElementById('role-tag');
        roleTag.innerText = staff.role === 'admin' ? 'بەڕێوەبەر' : 'ستاف';
        if (staff.role === 'admin') {
            roleTag.classList.add('admin');
        } else {
            document.getElementById('admin-card').style.display = 'none';
        }
    });

    document.getElementById('btn-logout').addEventListener('click', logout);
</script>
</body>
</html>
