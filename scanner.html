<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشەی پشکنینی کارت - ئاردوینۆ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .top-bar {
            width: 100%; background: #1a252f; padding: 10px 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }
        .top-bar a { color: #8fc7e3; text-decoration: none; }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar .staff-info { color: #cfe4f0; }
        .top-bar .role-tag {
            background: #2ecc71; color: #0f2740; font-size: 11px; font-weight: bold;
            padding: 2px 8px; border-radius: 10px; margin-right: 6px;
        }
        .top-bar .role-tag.admin { background: #f1c40f; }
        .top-bar button {
            background: none; border: 1px solid #445; color: #ccc; padding: 4px 12px;
            border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px;
        }
        .top-bar button:hover { background: #c0392b; border-color: #c0392b; color: white; }

        .page-body { display: flex; justify-content: center; align-items: center; flex: 1; width: 100%; }

        .scanner-container {
            background: #34495e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 600px;
            max-width: 92vw;
        }
        .control-panel {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-end { background-color: #95a5a6; color: white; }
        .btn-blue { background-color: #3498db; color: white; width: 100%; padding: 15px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; font-family: inherit; }
        .btn-blue:disabled { background-color: #5a6a78; cursor: not-allowed; }

        .status-bar { background: #1a252f; padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 14px; }
        .session-bar { background: #1a252f; padding: 8px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; }
        .session-bar.active { background: #1e6b3a; }

        .student-card-display {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            margin-top: 10px;
            transition: background-color 0.25s;
        }
        .student-card-display img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #34495e;
            background: #ddd;
        }
        .blue-active { background-color: #3498db !important; color: white !important; }
        .red-active { background-color: #e74c3c !important; color: white !important; }

        /* Modal for "forgot card" */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #34495e;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            max-width: 90vw;
            text-align: right;
        }
        .modal-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin: 12px 0;
            font-size: 15px;
            text-align: right;
        }
        .modal-error { color: #ff8a80; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

        .student-pick-list { max-height: 320px; overflow-y: auto; margin-top: 6px; }
        .student-pick-item {
            background: #2c3e50; padding: 10px 12px; border-radius: 6px; margin-bottom: 6px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .student-pick-item:hover { background: #3d5470; }
        .student-pick-item .cls { color: #95a5a6; font-size: 12px; }
        .empty-pick { color: #95a5a6; text-align: center; padding: 20px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="staff-info">
            <span class="role-tag" id="role-tag">...</span>
            <span id="staff-name-label">چاوەڕوانبە...</span>
        </div>
        <div style="display:flex; gap:14px; align-items:center;">
            <a href="home.html">🏠 سەرەکی</a>
            <a href="admin.html">🗂️ بەڕێوەبردن</a>
            <button id="btn-logout">چوونەدەرەوە</button>
        </div>
    </div>

    <div class="page-body">
    <div class="scanner-container">
        <h2>سیستەمی تۆمارکردنی ئامادەبووان</h2>

        <div class="control-panel">
            <button id="btn-connect" class="btn">پەیوەستکردنی ئاردوینۆ (Serial)</button>
            <button id="btn-disconnect" class="btn btn-danger" style="display:none;">بڕینی پەیوەندی</button>
        </div>
        <div class="control-panel">
            <button id="btn-start" class="btn btn-start">دەستپێکردنی دەوام</button>
            <button id="btn-end" class="btn btn-end" disabled>کۆتایی دەوام</button>
        </div>

        <div class="status-bar" id="connection-status">ئاردوینۆ: پەیوەست نییە</div>
        <div class="session-bar" id="session-status">دەوام: دەستپێنەکراوە</div>

        <div class="student-card-display" id="student-display">
            <img id="st-image" src="" alt="وێنەی قوتابی">
            <h1 id="st-name">تکایە کارتەکە دابنێ...</h1>
            <h3 id="st-class">---</h3>
            <p id="st-card" style="margin:4px 0 0; color:#888; font-size:14px;">---</p>
        </div>

        <div class="teacher-action">
            <button id="btn-forgot" class="btn-blue" disabled>قوتابی کارتەکەی بیرچووە؟ (تۆمارکردن بە شین)</button>
        </div>
    </div>
    </div>

    <!-- Modal بۆ تۆمارکردنی قوتابی کە کارتی بیرچووە -->
    <div class="modal-overlay" id="forgot-modal">
        <div class="modal-box">
            <h3 style="margin-top:0;">کام قوتابی کارتەکەی بیرچووە؟</h3>
            <input type="text" id="forgot-search" placeholder="گەڕان بە ناو یان پۆل...">
            <div class="modal-error" id="forgot-error"></div>
            <div class="student-pick-list" id="forgot-list"></div>
            <div class="modal-actions" style="margin-top:12px;">
                <button class="btn btn-end" id="forgot-cancel">پاشگەزبوونەوە</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { app } from "./firebase-config.js";
        import { requireStaffAuth, logout } from "./auth-guard.js";
        import { 
            getDatabase, ref, set, get, child, onValue, update 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // بەکارهێنانی Realtime Database لەبری Firestore
        const db = getDatabase(app);

        // ===== پاسەوانی چوونەژوورەوە: پێش هەموو شتێک دڵنیابە ستافە =====
        const staff = await requireStaffAuth();
        document.getElementById('staff-name-label').innerText = staff.name;
        const roleTag = document.getElementById('role-tag');
        roleTag.innerText = staff.role === 'admin' ? 'بەڕێوەبەر' : 'ستاف';
        if (staff.role === 'admin') roleTag.classList.add('admin');
        document.getElementById('btn-logout').addEventListener('click', logout);

        // ===== وێنەی جێگرەوە (لۆکاڵ، پێویستی بە ئینتەرنێت نییە) =====
        const PLACEHOLDER_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
            `<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'>
                <rect width='150' height='150' fill='#dfe6e9'/>
                <circle cx='75' cy='58' r='30' fill='#b2bec3'/>
                <rect x='30' y='95' width='90' height='50' rx='25' fill='#b2bec3'/>
            </svg>`
        );
        document.getElementById('st-image').src = PLACEHOLDER_IMG;

        // ===== دەنگی فیدباک (بێ فایلی دەرەکی) =====
        function beep(freq, duration, type = "sine") {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = type;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + duration);
                osc.onended = () => ctx.close();
            } catch (e) { /* AudioContext لەوانەیە کارنەکات، گرنگ نییە */ }
        }
        const soundSuccess = () => beep(880, 0.15);
        const soundError = () => { beep(220, 0.2, "square"); };
        const soundNotFound = () => { beep(300, 0.12, "square"); setTimeout(() => beep(300, 0.12, "square"), 160); };

        // ===== دۆخی گشتی =====
        let port, reader, keepReading = false;
        let sessionActive = false;
        let currentDateStr = null; // ڕۆژی دەوامی چالاک
        let lastCardId = null;
        let lastScanTime = 0;
        const SCAN_COOLDOWN_MS = 4000; // پارێزگاری لە دووبارە تۆمارکردنی هەمان کارت

        let studentsCache = {};      // { cardId: {name, class, imageUrl} } - هەموو قوتابییان
        let attendanceCache = {};    // { cardId: {status, ...} } - دۆخی ئەمڕۆ

        // هەموو قوتابییان بەردەوام دەخوێنینەوە لە Realtime Database
        onValue(ref(db, "students"), (snapshot) => {
            studentsCache = {};
            if (snapshot.exists()) {
                studentsCache = snapshot.val();
            }
        }, (err) => console.error("هەڵەی خوێندنەوەی قوتابییان:", err));

        function subscribeAttendance(day) {
            onValue(ref(db, `attendance/${day}/records`), (snapshot) => {
                attendanceCache = {};
                if (snapshot.exists()) {
                    attendanceCache = snapshot.val();
                }
            }, (err) => console.error("هەڵەی خوێندنەوەی ئامادەبوون:", err));
        }

        const el = (id) => document.getElementById(id);
        const connStatus = el('connection-status');
        const sessionStatus = el('session-status');
        const display = el('student-display');
        const btnConnect = el('btn-connect');
        const btnDisconnect = el('btn-disconnect');
        const btnStart = el('btn-start');
        const btnEnd = el('btn-end');
        const btnForgot = el('btn-forgot');

        // ===== پشکنینی پشتگیری وێبگەڕ بۆ Web Serial =====
        if (!("serial" in navigator)) {
            connStatus.innerText = "ئاردوینۆ: ئەم وێبگەڕە پشتگیری Web Serial ناکات (Chrome/Edge بەکاربهێنە)";
            btnConnect.disabled = true;
        }

        function resetDisplay(message = "تکایە کارتەکە دابنێ...") {
            el('st-image').src = PLACEHOLDER_IMG;
            el('st-name').innerText = message;
            el('st-class').innerText = "---";
            el('st-card').innerText = "---";
            display.classList.remove('blue-active', 'red-active');
        }

        // ===== دەستپێکردن/کۆتایی دەوام =====
        btnStart.addEventListener('click', () => {
            currentDateStr = new Date().toISOString().split('T')[0];
            sessionActive = true;
            sessionStatus.innerText = `دەوام: چالاکە (${currentDateStr})`;
            sessionStatus.classList.add('active');
            btnStart.disabled = true;
            btnEnd.disabled = false;
            btnForgot.disabled = false;
            subscribeAttendance(currentDateStr);
            resetDisplay();
        });

        btnEnd.addEventListener('click', async () => {
            const notArrived = Object.keys(studentsCache).filter(cardId => !attendanceCache[cardId]);

            if (notArrived.length > 0) {
                const ok = confirm(
                    `${notArrived.length} قوتابی هێشتا تۆمار نەکراون. ئایا دەتەوێت وەک "نەهاتوو" تۆمار بکرێن؟\n` +
                    `(ئەمە دەبێتە هۆی ئاگادارکردنەوەی بەخێوکەرانیان)`
                );
                if (ok) {
                    btnEnd.disabled = true;
                    btnEnd.textContent = 'چاوەڕوانبە...';
                    try {
                        const updates = {};
                        const timeNow = new Date().toISOString();
                        notArrived.forEach(cardId => {
                            updates[`attendance/${currentDateStr}/records/${cardId}`] = {
                                status: 'absent',
                                time: timeNow,
                                markedBy: staff.name
                            };
                        });
                        await update(ref(db), updates);
                    } catch (e) {
                        alert("هەڵە لە تۆمارکردنی نەهاتووەکان: " + e.message);
                    } finally {
                        btnEnd.textContent = 'کۆتایی دەوام';
                    }
                }
            }

            sessionActive = false;
            sessionStatus.innerText = "دەوام: کۆتایی هات";
            sessionStatus.classList.remove('active');
            btnStart.disabled = false;
            btnEnd.disabled = true;
            btnForgot.disabled = true;
            resetDisplay("دەوام کۆتایی هات");
        });

        // ===== پەیوەستکردن بە ئاردوینۆ =====
        btnConnect.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                connStatus.innerText = "ئاردوینۆ: پەیوەستە 🟢";
                btnConnect.style.display = 'none';
                btnDisconnect.style.display = 'inline-block';
                keepReading = true;
                readSerial();
            } catch (e) {
                connStatus.innerText = "ئاردوینۆ: پەیوەست نییە 🔴";
                alert("پەیوەستکردن سەرکەوتوو نەبوو: " + e);
            }
        });

        btnDisconnect.addEventListener('click', async () => {
            keepReading = false;
            try {
                if (reader) {
                    await reader.cancel();
                    reader.releaseLock();
                    reader = null;
                }
                if (port) {
                    await port.close();
                    port = null;
                }
            } catch (e) {
                console.error("هەڵە لە کاتی بڕینی پەیوەندی:", e);
            }
            connStatus.innerText = "ئاردوینۆ: پەیوەست نییە";
            btnConnect.style.display = 'inline-block';
            btnDisconnect.style.display = 'none';
        });

        async function readSerial() {
            while (port && port.readable && keepReading) {
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();
                try {
                    while (keepReading) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) {
                            const cleanCardId = value.trim();
                            if (cleanCardId.length > 3) { handleScan(cleanCardId); }
                        }
                    }
                } catch (error) {
                    console.error("هەڵەی خوێندنەوەی serial:", error);
                } finally {
                    try { reader.releaseLock(); } catch (e) {}
                }
            }
        }

        // ===== لۆجیکی سکان =====
        function handleScan(cardId) {
            if (!sessionActive) {
                resetDisplay("دەوام دەستپێنەکراوە - تکایە یەکەم جار (دەستپێکردنی دەوام) بکە");
                display.classList.add('red-active');
                soundError();
                return;
            }
            const now = Date.now();
            if (cardId === lastCardId && (now - lastScanTime) < SCAN_COOLDOWN_MS) {
                return; // خۆپارێزی لە دووبارە سکانکردنی هەمان کارت
            }
            lastCardId = cardId;
            lastScanTime = now;
            checkStudentRFID(cardId);
        }

        async function checkStudentRFID(cardId) {
            try {
                const snapshot = await get(child(ref(db), `students/${cardId}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    el('st-name').innerText = data.name || "بێ ناو";
                    el('st-class').innerText = data.class || "---";
                    el('st-card').innerText = cardId;
                    el('st-image').src = data.imageUrl || PLACEHOLDER_IMG;
                    display.classList.remove('blue-active', 'red-active');

                    await set(ref(db, `attendance/${currentDateStr}/records/${cardId}`), {
                        status: 'present',
                        name: data.name || null,
                        class: data.class || null,
                        time: new Date().toISOString()
                    });
                    soundSuccess();
                } else {
                    resetDisplay("کارتەکە نەناسراوە!");
                    display.classList.add('red-active');
                    soundNotFound();
                }
            } catch (e) {
                console.error("هەڵەی پەیوەندی بە Firebase:", e);
                resetDisplay("کێشەی ئینتەرنێت/سێرڤەر - تۆمار نەکرا، دووبارە هەوڵ بدەوە");
                display.classList.add('red-active');
                soundError();
            }
        }

        // ===== Modal: قوتابی کارتەکەی بیرچووە (لیستی نەهاتووەکان) =====
        const forgotModal = el('forgot-modal');
        const forgotSearch = el('forgot-search');
        const forgotError = el('forgot-error');
        const forgotList = el('forgot-list');

        btnForgot.addEventListener('click', () => {
            forgotSearch.value = "";
            forgotError.innerText = "";
            renderForgotList("");
            forgotModal.classList.add('open');
            forgotSearch.focus();
        });

        el('forgot-cancel').addEventListener('click', () => {
            forgotModal.classList.remove('open');
        });

        forgotSearch.addEventListener('input', () => renderForgotList(forgotSearch.value.trim().toLowerCase()));

        function renderForgotList(query) {
            forgotList.innerHTML = '';
            const notArrived = Object.entries(studentsCache)
                .filter(([cardId]) => !attendanceCache[cardId]) // تەنیا ئەوانەی هێشتا تۆمار نەکراون
                .filter(([, s]) => {
                    if (!query) return true;
                    return (s.name || '').toLowerCase().includes(query) || (s.class || '').toLowerCase().includes(query);
                })
                .sort(([, a], [, b]) => (a.name || '').localeCompare(b.name || '', 'ckb'));

            if (notArrived.length === 0) {
                forgotList.innerHTML = '<div class="empty-pick">هیچ قوتابییەکی نەهاتوو نەماوە کە بگونجێت</div>';
                return;
            }

            notArrived.forEach(([cardId, s]) => {
                const item = document.createElement('div');
                item.className = 'student-pick-item';
                item.innerHTML = `<span>${s.name || 'بێ ناو'}</span><span class="cls">${s.class || '---'}</span>`;
                item.addEventListener('click', () => markForgotCard(cardId, s));
                forgotList.appendChild(item);
            });
        }

        async function markForgotCard(cardId, student) {
            if (!sessionActive) {
                forgotError.innerText = "دەوام دەستپێنەکراوە";
                return;
            }
            try {
                await set(ref(db, `attendance/${currentDateStr}/records/${cardId}`), {
                    status: 'forgot-card',
                    name: student.name || null,
                    class: student.class || null,
                    time: new Date().toISOString()
                });
                forgotModal.classList.remove('open');
                display.classList.remove('red-active');
                display.classList.add('blue-active');
                el('st-name').innerText = student.name || "تۆمارکرا";
                el('st-class').innerText = student.class || "---";
                el('st-card').innerText = cardId;
                el('st-image').src = student.imageUrl || PLACEHOLDER_IMG;
                soundSuccess();
            } catch (e) {
                forgotError.innerText = "کێشەی پەیوەندی، دووبارە هەوڵ بدەوە";
            }
        }
    </script>
</body>
</html>
